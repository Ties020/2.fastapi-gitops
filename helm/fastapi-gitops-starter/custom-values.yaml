replicaCount: 1

image:
  repository: tiangolo/uvicorn-gunicorn-fastapi
  tag: python3.11
  pullPolicy: IfNotPresent

registry:
  createImagePullSecret: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 10

service:
  port: 80
  targetPort: 80
